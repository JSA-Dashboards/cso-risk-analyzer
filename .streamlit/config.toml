# JPSI brand theme (same as river-fob-portal / the admin portal): dark #32373c, blue #0693e3.
# Standalone runs only: the admin portal's own config.toml applies when this app is bundled there.
[theme]
base = "light"
primaryColor = "#0693e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#32373c"
font = "sans serif"

[server]
runOnSave = true
